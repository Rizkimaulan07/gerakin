databases:
  - name: gerakin-db
    databaseName: gerakin
    user: gerakin
    plan: free
    region: singapore

services:
  - type: web
    name: gerakin-app
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:setup && node server/index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gerakin-db
          property: connectionString
